# Phase 3: MF at BP's realised epoch count -- the iso-compute condition.
# See cifar10_mlp_3x2000_equal_epochs.yaml for the reasoning; the measured
# medians here were BP 26 epochs against MF 112.
#
# This MF_MLP has 2 hidden layers, so MF trains 3 stages rather than 4. BP spent
# 25.6 epochs on average: ceil(25.6 / 3) = 9, so MF trains 27 and is never given
# less compute than BP had. Early stopping is off so the budget is spent exactly;
# enabled and max_epochs are the only keys that differ from the rung 4 twin.

experiment_name: "mf_fashion_mnist_mlp_2x1000_equal_epochs"
run_summary_dir: "results/equal_epochs"
diagnostic_of: "configs/mf/fashion_mnist_mlp_2x1000.yaml"

algorithm:
  name: "MF"

data:
  name: "FashionMNIST"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [1000, 1000]
    activation: "ReLU"
    bias: true

algorithm_params:
  optimizer_type: "Adam"
  lr: 0.0004173533352347702
  weight_decay: 0.0003967779013101219
  log_interval: 9999
  activation_cache: recompute

early_stopping:
  enabled: false
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 20
  max_epochs: 9

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: "checkpoints/mf_fashion_mnist_mlp_2x1000_equal_epochs"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
