# Phase 3: the equal-total-epoch condition for CIFAR-10 rung 4.
#
# The harmonised ladder gives every rung the same PER-STAGE budget: 100 epochs,
# patience 20. BP has one stage, so it spends at most 100 epochs. MF trains its
# stages sequentially, so on this architecture it spends at most 4 x 100. The
# measured medians were BP 52 and MF 207, and that 4x gap is almost entirely the
# epoch count rather than the cost of an epoch: 4.87 s/epoch for BP against
# 4.73 s/epoch for MF.
#
# Per-stage parity and total parity are both defensible readings of "equal
# budget" and they answer different questions. Per-stage parity asks how good MF
# gets when each stage is trained to convergence. Total parity asks what MF
# delivers for the same number of epochs BP is allowed. This config is the
# second reading, fixed a priori rather than chosen after seeing the results:
# the 100-epoch total cap is split evenly across the 4 stages of a 3-hidden-layer
# MF_MLP, and patience keeps BP's ratio of 20 percent of the cap.
#
# Only max_epochs and patience move. metric, mode and min_delta stay at the
# harmonised values so the epoch budget is the single factor, which is what
# separates this from cifar10_mlp_3x2000_legacy_es.yaml: that one restores the
# whole pre-Phase-2 rule including min_delta.
#
# run_summary_dir keeps these out of results/runs, where analyze_ablation_ladder.py
# would key them to rung 4's (algorithm, cache) slot and overwrite it.

experiment_name: "mf_cifar10_mlp_3x2000_equal_epochs"
run_summary_dir: "results/equal_epochs"
diagnostic_of: "configs/mf/cifar10_mlp_3x2000.yaml"

algorithm:
  name: "MF"

data:
  name: "CIFAR10"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

algorithm_params:
  optimizer_type: "Adam"
  lr: 0.00021536491821693216
  weight_decay: 1.606438244272842e-06
  log_interval: 9999
  activation_cache: recompute

# 100 total epochs / 4 stages = 25; patience 5 holds BP's 20 percent of the cap.
early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 5
  max_epochs: 25

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: "checkpoints/mf_cifar10_mlp_3x2000_equal_epochs"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
