# Phase 4, task 1: the reproduction check (stop gate), BP half.
#
# The published comparator in Table 2 of the accepted paper: BP on the CIFAR-10
# 3x2000 MLP at 61.13 +/- 0.35 %, 268.45 +/- 8.1 s, 5.35 +/- 0.19 Wh,
# 1184 +/- 5 MiB over seeds 42, 123 and 7.
#
# Hyperparameters restored verbatim from commit 869d7b0; Phase 3 retuned the live
# config in place (lr 8.1159e-5 -> 7.6741e-5). Early stopping carries the legacy
# values through the shared Phase 2 block: 100 epochs, patience 20, min_delta 0.0
# on validation loss.
#
# ONE KNOWN DEPARTURE, and it is deliberate. The published baseline was built from
# MF_MLP, so it carried 90,720 unused projection-matrix parameters; Phase 2 made
# the BP path build a plain nn.Sequential instead. Those parameters never entered
# the forward pass, so they never received a gradient and AdamW skipped them
# entirely, leaving the numerics untouched. Only the parameter count and a little
# memory differ. Reintroducing the asymmetry purely to match a bug would put the
# reviewers' own complaint back into the codebase.

experiment_name: "repro_bp_cifar10_mlp_3x2000"
run_summary_dir: "results/reproduction"

algorithm:
  name: "BP"

data:
  name: "CIFAR10"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "AdamW"
  lr: 8.11587582031004e-05
  weight_decay: 2.0847447927718932e-05

training:
  criterion: "CrossEntropyLoss"
  log_interval: 100

early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 20
  max_epochs: 100

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: "checkpoints/repro_bp_cifar10_mlp_3x2000"
  save_best_metric: "bp_val_accuracy"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
