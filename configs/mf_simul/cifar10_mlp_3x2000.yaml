experiment_name: "mf_simul_cifar10_mlp_3x2000"

algorithm:
  name: "MF_SIMUL"

data:
  name: "CIFAR10"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "Adam"
  # Provisional: inherited from the tuned MF-Joint rung; re-tuned for MF-Simul
  # with an identical Optuna budget before the decisive runs.
  lr: 0.00018792091899949145
  weight_decay: 1.6676492206220718e-06

algorithm_params:
  # 1.0 keeps the objective identical to MF-Seq's per-unit local losses, so the
  # only difference from the staged algorithm is the schedule, not the weights.
  aux_weight: 1.0
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
