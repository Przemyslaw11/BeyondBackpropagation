# W1 control (c): MF-Seq-nom0 under Protocol B with S = L = 3 real stages.
#
# No M0 stage, so the matched-pass budget is ceil(Ebar_BP / 3), not /4.
# Planning value from G1 (Ebar_BP=52.95): ceil(52.95/3)=18 epochs per stage.
# The actual core-BP mean is used to freeze the config before the control runs.
# Patience equals the budget so early stopping cannot fire early; validation is
# retained every epoch.

experiment_name: "mf_nom0_protocol_b_cifar10_mlp_3x2000"
algorithm:
  name: "MF"

data:
  name: "CIFAR10"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

algorithm_params:
  optimizer_type: "Adam"
  lr: 0.00021536491821693216
  weight_decay: 1.606438244272842e-06
  log_interval: 9999
  activation_cache: recompute
  mf_train_m0: false

early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 18
  max_epochs: 18

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
