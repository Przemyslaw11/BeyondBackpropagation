general:
  seed: 42
  device: "auto"
  backend: "slurm"

backend:
  slurm:
    results_dir: "results"
    log_file: null
    data_loader:
      num_workers: 4
      pin_memory: true
  local:
    results_dir: "results/local"
    log_file: null
    data_loader:
      num_workers: 0
      pin_memory: false

training:
  epochs: 100
  criterion: "CrossEntropyLoss"
  log_interval: 100
  early_stopping_enabled: true
  early_stopping_metric: "bp_val_loss"
  early_stopping_patience: 20
  early_stopping_mode: "min"
  early_stopping_min_delta: 0.0

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

data:
  root: "./data"
  download: true
  val_split: 0.1

optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

algorithm_params:
  mf_early_stopping_enabled: false
  mf_early_stopping_patience: 10
  mf_early_stopping_min_delta: 0.0001

logging:
  level: "INFO"
  wandb:
    # Offline-friendly default (WP10); opt in per experiment via
    # `--set logging.wandb.use_wandb=true`.
    use_wandb: false
    project: "BeyondBackpropagation"
    # Entity is intentionally not hardcoded here. Provide it through a
    # CLI override (--set logging.wandb.entity=<entity>) or the
    # WANDB_ENTITY environment variable when W&B is enabled.

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2

carbon_tracker:
  enabled: true
  mode: "offline"
  output_dir: "results/carbon"
  country_iso_code: "POL"

profiling:
  enabled: true
  verbose: false

checkpointing:
  checkpoint_dir: null
  save_best_metric: "bp_val_accuracy"

tuning:
  enabled: false
  n_trials: 50
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  pruner: "Median"
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]