general:
  seed: 42
  device: "auto"
  backend: "slurm"

backend:
  slurm:
    results_dir: "results"
    log_file: null
    data_loader:
      num_workers: 4
      pin_memory: true
  local:
    results_dir: "results/local"
    log_file: null
    data_loader:
      num_workers: 0
      pin_memory: false

training:
  criterion: "CrossEntropyLoss"
  log_interval: 100

# Shared by BP, FF, CaFo and MF. max_epochs is the per-unit cap: epochs for BP and FF,
# epochs per layer for MF, epochs per predictor for CaFo.
early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 20
  max_epochs: 100

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

data:
  root: "./data"
  download: true
  val_split: 0.1

optimizer:
  type: "AdamW"
  lr: 0.001
  weight_decay: 0.0001

logging:
  level: "INFO"
  wandb:
    use_wandb: true
    project: "BeyondBackpropagation"
    entity: "przspyra11"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2

carbon_tracker:
  enabled: true
  mode: "offline"
  output_dir: "results/carbon"
  country_iso_code: "POL"

profiling:
  enabled: true
  verbose: false

checkpointing:
  checkpoint_dir: null
  keep_best_only: true
  save_best_metric: "bp_val_accuracy"

tuning:
  enabled: false
  n_trials: 50
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  # Uniform across algorithms: truncating MF mid-layer is not the same event as
  # truncating BP mid-epoch, so intermediate values are not comparable.
  pruner: "None"
  # Reduced epoch budget that pays for dropping the pruner. Same cap for every algorithm.
  max_epochs: 20
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]