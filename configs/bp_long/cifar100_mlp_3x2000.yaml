# DEPRECATED 2026-10-22: BP-long retired (BP never reaches the 100-epoch cap).
# H-W1d uses BP-fixed via scripts/slurm_scripts/w1_bp_fixed.slurm.
experiment_name: bp_long_cifar100_mlp_3x2000
algorithm:
  name: BP
data:
  name: CIFAR100
  root: ./data
  val_split: 0.1
  num_classes: 100
  input_channels: 3
  image_size: 32
data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
model:
  name: MF_MLP
  params:
    hidden_dims:
    - 2000
    - 2000
    - 2000
    activation: ReLU
    bias: true
training:
  criterion: CrossEntropyLoss
  log_interval: 100
optimizer:
  type: AdamW
  lr: 6.681923669912236e-05
  weight_decay: 2.9979680868782076e-06
# H-W1d: same arm as BP, only the epoch cap changes (100 -> 300).
early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 20
  max_epochs: 300
logging:
  level: INFO
  wandb:
    use_wandb: false
checkpointing:
  checkpoint_dir: null
monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
