experiment_name: bp_ds_cifar10_mlp_3x2000
algorithm:
  name: BP_DS

data:
  name: CIFAR10
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "AdamW"
  lr: 0.00014597886003206984
  weight_decay: 0.00013302354399272792

algorithm_params:
  aux_weight: 0.17140124774832802
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
