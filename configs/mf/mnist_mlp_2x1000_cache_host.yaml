experiment_name: mf_mnist_mlp_2x1000_cache_host
algorithm:
  name: MF
data:
  name: MNIST
  root: ./data
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28
data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
model:
  name: MF_MLP
  params:
    hidden_dims:
    - 1000
    - 1000
    activation: ReLU
    bias: true
# Ladder rung 6. Identical to rung 5 except that the cache lives in host memory,
# so the difference between them is where the activations sit and nothing else.
algorithm_params:
  lr: 0.00046569899460719333
  optimizer_type: Adam
  weight_decay: 2.815630680397746e-05
  log_interval: 9999
  activation_cache: cache_host
legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  algorithm_params:
    epochs_per_layer: 14
    mf_early_stopping_enabled: true
    mf_early_stopping_patience: 5
    mf_early_stopping_min_delta: 0.0001
logging:
  level: INFO
  wandb:
    use_wandb: true
checkpointing:
  checkpoint_dir: checkpoints/mf_mnist_mlp_2x1000
monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
tuning:
  enabled: false
