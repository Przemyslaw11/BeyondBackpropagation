experiment_name: "mf_cifar100_mlp_3x2000"
algorithm:
  name: "MF"

data:
  name: "CIFAR100"
  root: "./data"
  val_split: 0.1
  num_classes: 100
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

algorithm_params:
  optimizer_type: "Adam"
  lr: 0.00027089684419387227
  weight_decay: 7.204725563819985e-05
  log_interval: 9999
  # CIFAR training uses random crop/flip, so cached activations would go stale.
  activation_cache: recompute

legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  algorithm_params:
    epochs_per_layer: 8
    mf_early_stopping_enabled: true
    mf_early_stopping_patience: 4
    mf_early_stopping_min_delta: 0.0001

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: "checkpoints/mf_cifar100_mlp_3x2000"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
