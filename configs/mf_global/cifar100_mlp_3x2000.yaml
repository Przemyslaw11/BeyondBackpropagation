# W1 attribution ladder: Seq-Global arm.
#
# See configs/mf_global/cifar10_mlp_3x2000.yaml for the design note. Hyperparameters
# inherited from configs/mf/cifar100_mlp_3x2000.yaml (MF-Seq's tuned values).

experiment_name: "mf_global_cifar100_mlp_3x2000"
algorithm:
  name: "MF_GLOBAL"

data:
  name: "CIFAR100"
  root: "./data"
  val_split: 0.1
  num_classes: 100
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

algorithm_params:
  optimizer_type: "Adam"
  # Frozen 2026-11-10: best trial 43 of ladder_mfglobal_cifar100_mlp_3x2000_tune
  # (50/50 COMPLETE, tuned branch; PREREG-phase2.md section 9). Replaces the inherited MF-Seq values.
  lr: 0.0001109056767600036
  weight_decay: 0.0007586341653149853
  log_interval: 9999
  activation_cache: recompute

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: "checkpoints/mf_global_cifar100_mlp_3x2000"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
