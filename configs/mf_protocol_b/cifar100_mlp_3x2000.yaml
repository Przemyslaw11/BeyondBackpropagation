# W1 control (d): MF-Seq under Protocol B, contemporaneous with core BP.
# See configs/mf_protocol_b/cifar10_mlp_3x2000.yaml. Planning value:
# ceil(43.90 / 4) = 11 per stage; frozen from actual core-BP mean before running.

experiment_name: "mf_protocol_b_cifar100_mlp_3x2000"
algorithm:
  name: "MF"

data:
  name: "CIFAR100"
  root: "./data"
  val_split: 0.1
  num_classes: 100
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

algorithm_params:
  optimizer_type: "Adam"
  lr: 0.00027089684419387227
  weight_decay: 7.204725563819985e-05
  log_interval: 9999
  activation_cache: recompute

early_stopping:
  enabled: true
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 11
  max_epochs: 11

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
