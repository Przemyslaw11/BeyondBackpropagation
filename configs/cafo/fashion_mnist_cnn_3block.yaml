experiment_name: cafo_fashion_mnist_cnn_3block
run_summary_dir: results/phase4
algorithm:
  name: CaFo
data:
  name: FashionMNIST
  root: ./data
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28
data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
model:
  name: CaFo_CNN
  params:
    block_channels:
    - 32
    - 128
    - 512
    activation: ReLU
    use_batchnorm: true
    kernel_size: 3
    pool_kernel_size: 2
    pool_stride: 2
algorithm_params:
  optimizer_type: Adam
  lr: 0.001
  weight_decay: 0.0
  loss_type: CrossEntropyLoss
  log_interval: 200
  predictor_lr: 0.00021745043477436392
  predictor_weight_decay: 1.080034978479375e-06
legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  algorithm_params:
    num_epochs_per_block: 145
    # Stale even before Phase 2: the code read num_epochs_per_block, never this.
    epochs_per_block: 5000
    # These five keys were mistakenly at top level, so they never reached CaFo.
    predictor_early_stopping_enabled: true
    predictor_early_stopping_metric: val_loss
    predictor_early_stopping_patience: 8
    predictor_early_stopping_mode: min
    predictor_early_stopping_min_delta: 0.001
logging:
  level: INFO
  wandb:
    use_wandb: true
checkpointing:
  checkpoint_dir: checkpoints/cafo_fashion_mnist_cnn_3block
monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
