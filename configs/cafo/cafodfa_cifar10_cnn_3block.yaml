experiment_name: "cafodfa_cifar10_cnn_3block"
run_summary_dir: "results/phase4"
algorithm:
  name: "CaFo"

data:
  name: "CIFAR10"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "CaFo_CNN"
  params:
    block_channels: [32, 128, 512]
    activation: "ReLU"
    use_batchnorm: true
    kernel_size: 3
    pool_kernel_size: 2
    pool_stride: 2

algorithm_params:
  # --- Block Training (DFA) ---
  train_blocks: true
  block_training_epochs: 250
  block_optimizer_type: "Adam"
  block_lr: 0.0002931550261218198
  block_weight_decay: 7.04404034634953e-06

  # --- Predictor Training (CE) ---
  predictor_optimizer_type: "Adam"
  predictor_lr: 0.00025047891426163314
  predictor_weight_decay: 2.8729896512284735e-07
  loss_type: "CrossEntropyLoss"
  log_interval: 9999
  aggregation_method: "sum"

legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  algorithm_params:
    num_epochs_per_block: 147
    predictor_early_stopping_enabled: true
    predictor_early_stopping_metric: "val_loss"
    predictor_early_stopping_patience: 8
    predictor_early_stopping_mode: "min"
    predictor_early_stopping_min_delta: 0.001

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: "checkpoints/cafodfa_cifar10_cnn_3block"
  save_best_metric: "bp_val_accuracy"

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false