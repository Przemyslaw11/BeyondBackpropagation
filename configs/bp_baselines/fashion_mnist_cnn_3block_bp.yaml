experiment_name: bp_baseline_fashion_mnist_cnn_3block
run_summary_dir: results/phase4
algorithm:
  name: BP
data:
  name: FashionMNIST
  root: ./data
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28
data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
model:
  name: CaFo_CNN
  params:
    block_channels:
    - 32
    - 128
    - 512
    activation: ReLU
    use_batchnorm: true
    kernel_size: 3
    pool_kernel_size: 2
    pool_stride: 2
optimizer:
  type: AdamW
  lr: 0.00031144909554799177
  weight_decay: 2.4041190791618886e-06
training:
  criterion: CrossEntropyLoss
  log_interval: 100
legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  training:
    epochs: 100
    early_stopping_metric: bp_val_loss
    early_stopping_patience: 10
    early_stopping_mode: min
    early_stopping_min_delta: 0.0
  tuning:
    num_epochs: 15
    pruner: Median
tuning:
  enabled: true
  n_trials: 10
  direction: maximize
  metric: val_accuracy
  sampler: TPE
  pruner: None
  lr_range:
  - 1.0e-05
  - 0.01
  wd_range:
  - 1.0e-06
  - 0.001
checkpointing:
  checkpoint_dir: checkpoints/bp_baseline_fashion_mnist_cnn_3block
  save_best_metric: bp_val_accuracy
logging:
  level: INFO
  wandb:
    use_wandb: true
monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
