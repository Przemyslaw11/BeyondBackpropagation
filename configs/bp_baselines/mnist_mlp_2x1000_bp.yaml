experiment_name: bp_baseline_mnist_mlp_2x1000
algorithm:
  name: BP
data:
  name: MNIST
  root: ./data
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28
data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
model:
  name: MF_MLP
  params:
    hidden_dims:
    - 1000
    - 1000
    activation: ReLU
    bias: true
optimizer:
  type: AdamW
  lr: 0.00021980598088929354
  weight_decay: 0.0003378989803913246
training:
  criterion: CrossEntropyLoss
  log_interval: 100
legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  training:
    epochs: 100
    early_stopping_metric: bp_val_loss
    early_stopping_patience: 10
    early_stopping_mode: min
    early_stopping_min_delta: 0.0
  tuning:
    num_epochs: 10
    pruner: Median
tuning:
  enabled: true
  n_trials: 5
  direction: maximize
  metric: val_accuracy
  sampler: TPE
  pruner: None
  lr_range:
  - 1.0e-05
  - 0.01
  wd_range:
  - 1.0e-06
  - 0.001
checkpointing:
  checkpoint_dir: checkpoints/bp_baseline_mnist_mlp_2x1000
  save_best_metric: bp_val_accuracy
logging:
  level: INFO
  wandb:
    use_wandb: true
monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
