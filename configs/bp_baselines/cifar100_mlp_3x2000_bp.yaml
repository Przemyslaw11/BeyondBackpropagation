experiment_name: bp_cifar100_mlp_3x2000
algorithm:
  name: BP
data:
  name: CIFAR100
  root: ./data
  val_split: 0.1
  num_classes: 100
  input_channels: 3
  image_size: 32
data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true
model:
  name: MF_MLP
  params:
    hidden_dims:
    - 2000
    - 2000
    - 2000
    activation: ReLU
    bias: true
training:
  criterion: CrossEntropyLoss
  log_interval: 100
legacy_hyperparameters:  # Pre-Phase-2 protocol, kept for the disclosure table.
  training:
    epochs: 100
    early_stopping_metric: bp_val_loss
    early_stopping_patience: 5
    early_stopping_mode: min
    early_stopping_min_delta: 0.0
  tuning:
    num_epochs: 15
    pruner: Median
optimizer:
  type: AdamW
  lr: 0.00010362161015212055
  weight_decay: 9.105881789069153e-06
logging:
  level: INFO
  wandb:
    use_wandb: true
    project: BeyondBackpropagation
checkpointing:
  checkpoint_dir: checkpoints/bp_cifar100_mlp_3x2000
  save_best_metric: bp_val_accuracy
monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
tuning:
  enabled: true
  n_trials: 10
  direction: maximize
  metric: val_accuracy
  sampler: TPE
  pruner: None
  lr_range:
  - 1.0e-05
  - 0.01
  wd_range:
  - 1.0e-06
  - 0.001
