experiment_name: mf_joint_mnist_mlp_2x1000
algorithm:
  name: MF_JOINT

data:
  name: MNIST
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [1000, 1000]
    activation: "ReLU"
    bias: true

# Adam, as MF uses; output_layer stays frozen because M_L is the readout.
optimizer:
  type: "Adam"
  lr: 0.00020438352229239622
  weight_decay: 4.092878580565055e-05

algorithm_params:
  aux_weight: 6.358639373920577
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
