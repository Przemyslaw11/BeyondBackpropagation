experiment_name: "tune_mfjoint_fashion_mnist_mlp_2x1000"
algorithm:
  name: MF_JOINT

data:
  name: FashionMNIST
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28

data_loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false

model:
  name: "MF_MLP"
  params:
    hidden_dims: [1000, 1000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "Adam"

algorithm_params:
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: false

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: false
  energy_enabled: false
profiling:
  enabled: false

tuning:
  enabled: true
  n_trials: 50
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  pruner: "None"
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]
  aux_weight_range: [1.0e-2, 1.0e+1]
