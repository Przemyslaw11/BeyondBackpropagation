experiment_name: "tune_bp_mnist_mlp_4x2000"
algorithm:
  name: BP

data:
  name: MNIST
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28

data_loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false

model:
  name: "FF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000, 2000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "AdamW"

training:
  criterion: CrossEntropyLoss
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: false

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: false
  energy_enabled: false
profiling:
  enabled: false

# The published 4x2000 baseline carries the same lr and weight decay as the
# 3x1000 one, to the last digit. Two architectures do not land on identical
# optima; one study was reused for both. This gives 4x2000 its own search.
tuning:
  enabled: true
  n_trials: 50
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  pruner: "None"
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]
