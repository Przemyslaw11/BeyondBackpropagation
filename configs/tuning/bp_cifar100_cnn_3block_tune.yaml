experiment_name: "tune_bp_cifar100_cnn_3block"
algorithm:
  name: BP

data:
  name: CIFAR100
  root: "./data"
  val_split: 0.1
  num_classes: 100
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false

model:
  name: "CaFo_CNN"
  params:
    block_channels: [32, 128, 512]
    activation: "ReLU"
    use_batchnorm: true
    kernel_size: 3
    pool_kernel_size: 2
    pool_stride: 2

optimizer:
  type: "AdamW"

training:
  criterion: CrossEntropyLoss
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: false

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: false
  energy_enabled: false
profiling:
  enabled: false

tuning:
  enabled: true
  n_trials: 30
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  pruner: "None"
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]
