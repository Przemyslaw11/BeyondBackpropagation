experiment_name: "tune_bp_fashion_mnist_mlp_4x2000"
algorithm:
  name: BP

data:
  name: FashionMNIST
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28

data_loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false

model:
  name: "FF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000, 2000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "AdamW"

training:
  criterion: CrossEntropyLoss
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: false

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: false
  energy_enabled: false
profiling:
  enabled: false

# This is the BP side of the headline 13x time claim, so its budget matters more
# than any other baseline here: FF was tuned over 50 trials, BP over 10.
tuning:
  enabled: true
  n_trials: 50
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  pruner: "None"
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]
