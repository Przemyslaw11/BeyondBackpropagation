experiment_name: "tune_bp_mnist_cnn_3block"
algorithm:
  name: BP

data:
  name: MNIST
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 1
  image_size: 28

data_loader:
  batch_size: 128
  num_workers: 0
  pin_memory: false

model:
  name: "CaFo_CNN"
  params:
    block_channels: [32, 128, 512]
    activation: "ReLU"
    use_batchnorm: true
    kernel_size: 3
    pool_kernel_size: 2
    pool_stride: 2

optimizer:
  type: "AdamW"

training:
  criterion: CrossEntropyLoss
  log_interval: 9999

logging:
  level: "INFO"
  wandb:
    use_wandb: false

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: false
  energy_enabled: false
profiling:
  enabled: false

# The published CNN baseline had 10 trials against CaFo's 50. Matching the budget
# is the point of re-tuning: an accuracy gap bought with five times the search is
# not an accuracy gap between algorithms. 30 is CaFo's Phase 4 budget, so the CNN
# comparison is now decided by the algorithms rather than by search effort.
tuning:
  enabled: true
  n_trials: 30
  direction: "maximize"
  metric: "val_accuracy"
  sampler: "TPE"
  pruner: "None"
  lr_range: [1.0e-5, 1.0e-2]
  wd_range: [1.0e-6, 1.0e-3]
