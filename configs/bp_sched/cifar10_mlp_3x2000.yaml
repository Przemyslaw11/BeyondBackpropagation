# W1 control (a): BP with a tuned cosine LR schedule and a fixed epoch budget.
#
# This arm is not a new primary hypothesis. It tests whether BP's accuracy is
# limited by its piecewise-constant LR / early-stop stopping point. The LR/WD
# values below are the core-BP fallback, not MF-Seq's; the frozen values are the
# best trial of the 50-trial-per-dataset BP-sched ladder study if >=20 trials
# completed per dataset, otherwise keep these core-BP values. Do not submit this
# arm before the branch is recorded in PREREG-phase2.md §9.
#
# Fixed budget: 100 epochs, no early stopping. Validation still runs every epoch,
# so the comparison is not given a validation-free advantage. Cosine T_max=100.

experiment_name: "bp_sched_cifar10_mlp_3x2000"
algorithm:
  name: "BP"

data:
  name: "CIFAR10"
  root: "./data"
  val_split: 0.1
  num_classes: 10
  input_channels: 3
  image_size: 32

data_loader:
  batch_size: 128
  num_workers: 4
  pin_memory: true

model:
  name: "MF_MLP"
  params:
    hidden_dims: [2000, 2000, 2000]
    activation: "ReLU"
    bias: true

optimizer:
  type: "AdamW"
  # PLACEHOLDER: replace with the frozen BP-sched study best params.
  lr: 7.67408805303038e-05
  weight_decay: 3.67072980229754e-05

training:
  criterion: "CrossEntropyLoss"
  log_interval: 100
  scheduler: "CosineAnnealingLR"
  scheduler_params: {}

early_stopping:
  enabled: false
  metric: "val_loss"
  mode: "min"
  min_delta: 0.0
  patience: 20
  max_epochs: 100

logging:
  level: "INFO"
  wandb:
    use_wandb: true

checkpointing:
  checkpoint_dir: null

monitoring:
  enabled: true
  energy_enabled: true
  energy_interval_sec: 0.2
profiling:
  enabled: true
  verbose: false
